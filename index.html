<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        
        <!-- Default Location and Search Section -->
        <div class="default-location">
            <input type="text" id="locationInput" placeholder="Enter a city">
            <button id="searchButton">Search</button>
            <button id="setDefaultButton">Set as Default</button>
        </div>

        <!-- Weather Information Display -->
        <div class="weather-info">
            <h2 id="location">Loading...</h2>
            <p id="temperature"></p>
            <p id="description"></p>
            <p id="humidity"></p>
            <p id="wind"></p>
            <p id="precipitation"></p>
            <p id="uv-index"></p>
        </div>

        <!-- Error Message Display -->
        <div id="error-message" class="hidden"></div>
    </div>

    <!-- Footer Section for Profile Links -->
    <div class="profile-info">
        <p>Twitter: <a href="https://twitter.com/DEOXYRIBOSE404" target="_blank">@DEOXYRIBOSE404</a></p>
        <p>Instagram: <a href="https://www.instagram.com/one.one.oneone" target="_blank">one.one.oneone</a></p>
        <p>WhatsApp: <a href="https://wa.me/0814532273" target="_blank">0814532273</a></p>
        <p>Email: <a href="mailto:Telmonm@gmail.com">Telmonm@gmail.com</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
